title: New USB Unit With a Serial Format Unlike Its Model
id: 221916e8-c19a-4f8b-8062-9a2d20505985
name: serial_format_mismatch
status: test
description: |
  Other units of the same VID/PID are known, but this new unit's serial number has a different
  structure (length and character classes), as a hand-written spoofed serial often does.
references:
  - https://attack.mitre.org/techniques/T1200/
  - https://attack.mitre.org/techniques/T1036/
author: TraceForge team (Tanisha Saha, Adithya Ajith, Sharvin Shetty)
date: 2026-10-28
tags:
  - attack.initial-access
  - attack.t1200
  - attack.defense-evasion
  - attack.t1036
logsource:
  product: traceforge
  category: usb_connect
detection:
  selection:
    device.first_seen: true
    device.serial_fits_model: false
  has_serial:
    device.serial|exists: true
  condition: selection and has_serial
falsepositives:
  - A manufacturer changing serial formats between production batches
level: medium
risk:  # NIST SP 800-30 Rev. 1 risk assessment (server/scoring/nist.py)
  likelihood: 40
  impact: 85
  rationale: >-
    Likelihood Moderate (an unusual serial format is somewhat likely to be spoofed; manufacturers do change formats). Impact High (a lookalike of an approved model).
