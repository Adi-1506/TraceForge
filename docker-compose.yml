services:
  db:
    image: postgres:16
    container_name: traceforge-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: traceforge
      POSTGRES_PASSWORD: traceforge
      POSTGRES_DB: traceforge
    ports:
      - "5432:5432"
    volumes:
      - traceforge_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traceforge"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  traceforge_pgdata:
